<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body{

background:#121212;
color:#eee;
font-family:Arial;
padding:30px;

}


.container{

max-width:1000px;
margin:auto;

}


h1{

color:white;

}



.top{

display:flex;

gap:10px;

align-items:center;

margin-bottom:20px;

}



button{

padding:12px 20px;

border:0;

border-radius:8px;

background:#2563eb;

color:white;

cursor:pointer;

}



button:hover{

background:#3b82f6;

}


.danger{

background:#dc2626;

}


.danger:hover{

background:#ef4444;

}



#count{

margin-bottom:15px;

color:#aaa;

}



textarea{

width:100%;

height:600px;

background:#0b0b0b;

color:#ddd;

border:1px solid #333;

border-radius:10px;

padding:15px;

font-family:monospace;

font-size:14px;

}



</style>


</head>


<body>


<div class="container">


<h1>
Youtube Saver Manager
</h1>



<div class="top">


<button id="download">
Download JSON
</button>


<button id="clear" class="danger">
Clear Storage
</button>


</div>



<div id="count">
Total: 0
</div>



<textarea id="json" readonly></textarea>



</div>



<script src="manager.js"></script>


</body>


</html>
