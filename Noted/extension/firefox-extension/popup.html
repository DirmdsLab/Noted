<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<style>

body{

width:620px;

background:#121212;

color:#eee;

font-family:Arial;

padding:15px;

}


h2{

margin-top:0;

}


.box{

background:#1e1e1e;

padding:10px;

border-radius:8px;

font-size:12px;

word-break:break-all;

}



select,
button{

width:100%;

margin-top:10px;

padding:10px;

border-radius:8px;

border:0;

}



select{

background:#222;

color:white;

}



button{

background:#2563eb;

color:white;

cursor:pointer;

}



button:hover{

background:#3b82f6;

}


#count{

margin-top:15px;

color:#aaa;

font-size:13px;

}


</style>

</head>


<body>


<h2>
Youtube Saver
</h2>


<div id="url" class="box">
Loading...
</div>



<label>
Subtitle
</label>


<select id="sub">

<option value="">
None
</option>

<option value="en">
English
</option>

<option value="id">
Indonesia
</option>

<option value="ja">
Japanese
</option>

</select>




<label>
Resolution
</label>


<select id="resolution">

<option value="">
None
</option>

<option value="4k">
4K
</option>

<option value="1080">
1080
</option>

<option value="720">
720
</option>

</select>



<button id="save">
Save
</button>


<button id="open">
Open Full Page
</button>


<div id="count">

Total: 0

</div>



<script src="popup.js"></script>


</body>

</html>
